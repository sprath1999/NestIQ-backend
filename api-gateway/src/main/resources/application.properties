# Server
server.port=8080
spring.application.name=api-gateway

# Auth Service Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Resident Service Routes
spring.cloud.gateway.routes[1].id=resident-service
spring.cloud.gateway.routes[1].uri=${RESIDENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/complaints/**

# Amenities Route
spring.cloud.gateway.routes[2].id=amenities
spring.cloud.gateway.routes[2].uri=${RESIDENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[2].predicates[0]=Path=/amenities/**

spring.cloud.gateway.routes[3].id=notices
spring.cloud.gateway.routes[3].uri=${RESIDENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[3].predicates[0]=Path=/notices/**

spring.cloud.gateway.routes[4].id=visitor-service
spring.cloud.gateway.routes[4].uri=${VISITOR_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[4].predicates[0]=Path=/visitors/**

spring.cloud.gateway.routes[6].id=flats
spring.cloud.gateway.routes[6].uri=${RESIDENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[6].predicates[0]=Path=/flats/**


#
#spring.cloud.gateway.routes[5].id=notification-service
#spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
#spring.cloud.gateway.routes[5].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[5].predicates[0]=Path=/notifications/**



# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Actuator
management.endpoints.web.exposure.include=*