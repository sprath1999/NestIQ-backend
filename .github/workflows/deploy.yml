name: NestIQ Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build auth-service
        run: |
          cd auth-service
          mvn clean package -DskipTests

      - name: Build resident-service
        run: |
          cd resident-service
          mvn clean package -DskipTests

      - name: Build api-gateway
        run: |
          cd api-gateway
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push auth-service image
        uses: docker/build-push-action@v4
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nestiq-auth:latest

      - name: Build and push resident-service image
        uses: docker/build-push-action@v4
        with:
          context: ./resident-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nestiq-resident:latest

      - name: Build and push api-gateway image
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nestiq-gateway:latest
